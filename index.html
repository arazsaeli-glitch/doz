<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دوز P2P — بدون سرور</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

  * { box-sizing: border-box; }

  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 28px 16px 40px;
    color: #f8fafc;
    background:
      radial-gradient(circle at 15% 10%, rgba(99,102,241,.30), transparent 32%),
      radial-gradient(circle at 90% 20%, rgba(168,85,247,.24), transparent 30%),
      radial-gradient(circle at 50% 100%, rgba(14,165,233,.18), transparent 35%),
      linear-gradient(145deg, #080b16 0%, #11162a 48%, #090c18 100%);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(to bottom, black, transparent 85%);
  }

  h1 {
    margin: 0 0 18px;
    text-align: center;
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 900;
    letter-spacing: -1px;
    text-shadow: 0 4px 18px rgba(99,102,241,.45);
  }

  #status {
    padding: 14px 16px;
    background: rgba(255,255,255,.075);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    margin: 14px 0 20px;
    min-height: 24px;
    text-align: center;
    font-weight: 600;
    color: #e2e8f0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 12px 35px rgba(0,0,0,.18);
    backdrop-filter: blur(14px);
  }

  .row {
    display: flex;
    gap: 10px;
    margin: 10px 0;
  }

  input, button {
    padding: 12px 15px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border-radius: 13px;
  }

  button {
    cursor: pointer;
    color: #fff;
    border: 0;
    background: linear-gradient(145deg, #6366f1, #4f46e5);
    box-shadow:
      0 7px 0 #3730a3,
      0 13px 25px rgba(79,70,229,.30),
      inset 0 1px 0 rgba(255,255,255,.28);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }

  button:hover:not(:disabled) {
    filter: brightness(1.08);
    transform: translateY(-2px);
    box-shadow:
      0 9px 0 #3730a3,
      0 17px 30px rgba(79,70,229,.35),
      inset 0 1px 0 rgba(255,255,255,.3);
  }

  button:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow:
      0 3px 0 #3730a3,
      0 7px 14px rgba(79,70,229,.25),
      inset 0 1px 0 rgba(255,255,255,.2);
  }

  button:disabled {
    background: linear-gradient(145deg, #334155, #1e293b);
    color: #64748b;
    cursor: not-allowed;
    box-shadow: 0 4px 0 #0f172a;
  }

  button.ghost {
    background: linear-gradient(145deg, #334155, #1e293b);
    color: #e2e8f0;
    box-shadow: 0 6px 0 #0f172a, 0 12px 24px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12);
  }

  button.ghost:hover:not(:disabled) {
    box-shadow: 0 8px 0 #0f172a, 0 16px 28px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.15);
  }

  #game {
    position: relative;
    padding: 22px;
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
    box-shadow:
      0 24px 60px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.1);
    backdrop-filter: blur(18px);
  }

  #game::before {
    content: '';
    position: absolute;
    inset: 1px;
    border-radius: 23px;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.08), transparent 30%);
  }

  #shareBox, #errorBox {
    margin-bottom: 18px;
    padding: 16px;
    text-align: center;
    color: #cbd5e1;
    background: rgba(15,23,42,.55);
    border: 1px solid rgba(129,140,248,.2);
    border-radius: 17px;
    position: relative;
    z-index: 1;
  }

  #shareBox .share-label,
  #errorBox .err-label {
    font-size: 13px;
    margin-bottom: 4px;
    color: #94a3b8;
  }

  #shareBox .row, #errorBox .row { margin: 12px 0 0; }
  #shareBox .row button, #errorBox .row button { flex: 1; }

  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 11px;
    width: min(330px, 100%);
    margin: 10px auto 20px;
    padding: 11px;
    border-radius: 23px;
    background: linear-gradient(145deg, #0b1020, #1b2340);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow:
      0 20px 45px rgba(0,0,0,.38),
      inset 0 2px 3px rgba(255,255,255,.05);
  }

  .cell {
    aspect-ratio: 1;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    font-size: clamp(42px, 13vw, 66px);
    font-weight: 900;
    line-height: 1;
    color: #f8fafc;
    background: linear-gradient(145deg, #202a49, #11182d);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 17px;
    cursor: pointer;
    box-shadow:
      0 8px 0 #0a0f1e,
      0 12px 20px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.08);
  }

  .cell:hover:not(:disabled) {
    transform: translateY(-3px);
    background: linear-gradient(145deg, #2d3b68, #18213d);
    box-shadow:
      0 11px 0 #0a0f1e,
      0 18px 25px rgba(0,0,0,.3),
      inset 0 1px 0 rgba(255,255,255,.12);
  }

  .cell:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow:
      0 3px 0 #0a0f1e,
      0 7px 14px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.08);
  }

  .cell:disabled { cursor: default; }

  .hidden { display: none !important; }

  .code {
    font-size: 34px;
    letter-spacing: 10px;
    font-weight: 900;
    text-align: center;
    padding: 8px;
    direction: ltr;
    color: #a5b4fc;
    text-shadow: 0 3px 15px rgba(129,140,248,.5);
  }

  #game .row { justify-content: center; }
  #resetBtn { min-width: 150px; }

  @media (max-width: 420px) {
    body { padding: 20px 12px 30px; }
    #game { padding: 17px; border-radius: 20px; }
    .row { flex-direction: column; }
    #resetBtn { width: 100%; }
    #board { gap: 8px; padding: 8px; }
    .cell { border-radius: 14px; }
    .code { font-size: 28px; letter-spacing: 7px; }
  }
</style>
</head>
<body>
<h1>🎮 دوز P2P</h1>
<div id="status">آماده.</div>

<div id="game">
  <!-- فقط میزبان می‌بیند -->
  <div id="shareBox" class="hidden">
    <div class="share-label">کد اتاق — برای دوستت بفرست تا مستقیم بیاد تو بازی:</div>
    <div id="roomCode" class="code"></div>
    <div class="row">
      <button id="copyBtn" class="ghost">کپی لینک دعوت</button>
    </div>
  </div>

  <!-- فقط وقتی خطا باشد -->
  <div id="errorBox" class="hidden">
    <div class="err-label" id="errorText"></div>
    <div class="row">
      <button id="newRoomBtn" class="ghost">ساخت اتاق جدید</button>
    </div>
  </div>

  <div id="board"></div>
  <div class="row">
    <button id="resetBtn" class="ghost">شروع مجدد</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  const PREFIX = 'ttt-';
  const CODE_RE = /^[A-Z0-9]{5}$/;
  const $ = id => document.getElementById(id);
  const statusEl = $('status');

  let peer = null;
  let conn = null;
  let role = null;         // 'host' | 'guest'
  let myMark = null;
  let myTurn = false;
  let gameOver = false;
  let connected = false;
  let roomCode = '';
  let board = Array(9).fill('');

  const setStatus = t => { statusEl.textContent = t; };

  // ---------- کد اتاق ----------
  function genCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // بدون حروف گیج‌کننده
    let s = '';
    for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function inviteLink() {
    return location.origin + location.pathname + '#' + roomCode;
  }

  function showShare() {
    $('roomCode').textContent = roomCode;
    $('shareBox').classList.remove('hidden');
  }

  function showError(msg) {
    $('errorText').textContent = msg;
    $('errorBox').classList.remove('hidden');
  }

  function hideError() {
    $('errorBox').classList.add('hidden');
  }

  // ---------- شروع خودکار ----------
  function boot() {
    const hash = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim().toUpperCase();
    if (CODE_RE.test(hash)) {
      joinRoom(hash);   // با لینک/کد اومده → مستقیم مهمان
    } else {
      createRoom();     // خودش میزبان می‌شود → مستقیم تو بازی
    }
  }

  // ---------- میزبان ----------
  function createRoom() {
    role = 'host';
    myMark = 'X';
    connected = false;
    gameOver = false;
    myTurn = false;
    board = Array(9).fill('');
    roomCode = genCode();

    hideError();
    showShare();
    render();
    setStatus('در حال ساخت اتاق...');

    try { if (peer) peer.destroy(); } catch {}

    peer = new Peer(PREFIX + roomCode, { debug: 1 });

    peer.on('open', () => {
      setStatus('منتظر حریف... لینک دعوت را برای دوستت بفرست.');
    });

    peer.on('connection', c => {
      if (conn && conn.open) { try { c.close(); } catch {} return; } // فقط یک مهمان
      setupConn(c);
    });

    peer.on('error', err => {
      if (err.type === 'unavailable-id') {
        try { peer.destroy(); } catch {}
        createRoom(); // کد تکراری، یکی دیگر بساز
      } else {
        setStatus('خطا: ' + err.type);
      }
    });
  }

  // ---------- مهمان ----------
  function joinRoom(code) {
    role = 'guest';
    myMark = 'O';
    connected = false;
    gameOver = false;
    myTurn = false;
    board = Array(9).fill('');
    roomCode = code;

    $('shareBox').classList.add('hidden');
    hideError();
    render();
    setStatus('در حال اتصال به اتاق ' + code + ' ...');

    try { if (peer) peer.destroy(); } catch {}

    peer = new Peer({ debug: 1 });

    peer.on('open', () => {
      const c = peer.connect(PREFIX + code, { reliable: true });
      setupConn(c);
    });

    peer.on('error', err => {
      if (err.type === 'peer-unavailable') {
        setStatus('اتاقی با این کد پیدا نشد.');
        showError('اتاقی با کد ' + code + ' پیدا نشد. شاید میزبان صفحه را بسته است.');
      } else {
        setStatus('خطا: ' + err.type);
      }
    });
  }

  // ---------- اتصال ----------
  function setupConn(c) {
    conn = c;

    c.on('open', () => {
      connected = true;
      board = Array(9).fill('');
      gameOver = false;
      myTurn = (myMark === 'X');
      $('shareBox').classList.add('hidden');
      hideError();
      render();
      setStatus('شروع! نوبت ' + (myTurn ? 'تو' : 'حریف'));
    });

    c.on('data', data => {
      if (!data || typeof data !== 'object') return;
      if (data.type === 'move') applyMove(data.index, data.mark);
      else if (data.type === 'reset') resetGame(false);
    });

    c.on('close', () => {
      connected = false;
      conn = null;
      gameOver = false;
      if (role === 'host') {
        showShare();
        setStatus('حریف قطع شد. منتظر اتصال دوباره...');
      } else {
        setStatus('ارتباط قطع شد.');
        showError('ارتباط با میزبان قطع شد.');
      }
      render();
    });

    c.on('error', err => setStatus('خطای اتصال: ' + (err.message || '')));
  }

  // ---------- منطق بازی ----------
  function applyMove(i, mark) {
    if (gameOver || board[i]) return;
    board[i] = mark;
    myTurn = !myTurn;
    render();
    checkWin();
    if (!gameOver) setStatus('نوبت ' + (myTurn ? 'تو' : 'حریف'));
  }

  function makeMove(i) {
    if (gameOver || !myTurn || board[i]) return;
    if (!connected || !conn || !conn.open) return;
    applyMove(i, myMark);
    conn.send({ type: 'move', index: i, mark: myMark });
  }

  function checkWin() {
    const W = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (const [a,b,c] of W) {
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        gameOver = true;
        setStatus(board[a] === myMark ? 'بردی! 🎉' : 'باختی 😢');
        return;
      }
    }
    if (!board.includes('')) { gameOver = true; setStatus('مساوی 🤝'); }
  }

  function resetGame(send = true) {
    if (send && (!connected || !conn || !conn.open)) return;
    board = Array(9).fill('');
    myTurn = (myMark === 'X');
    gameOver = false;
    render();
    setStatus('بازی جدید. نوبت ' + (myTurn ? 'تو' : 'حریف'));
    if (send) conn.send({ type: 'reset' });
  }

  function render() {
    const b = $('board');
    b.innerHTML = '';
    board.forEach((v, i) => {
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.textContent = v;
      btn.disabled = !!v || gameOver || !myTurn || !connected;
      btn.onclick = () => makeMove(i);
      b.appendChild(btn);
    });
    $('resetBtn').disabled = !connected;
  }

  // ---------- UI ----------
  $('resetBtn').onclick = () => resetGame(true);

  $('copyBtn').onclick = async () => {
    const link = inviteLink();
    try {
      await navigator.clipboard.writeText(link);
      setStatus('لینک کپی شد ✅ بفرست برای دوستت.');
    } catch {
      window.prompt('این لینک را کپی کن:', link);
    }
  };

  $('newRoomBtn').onclick = () => {
    try { history.replaceState(null, '', location.pathname + location.search); } catch {}
    location.reload();
  };

  boot();
})();
</script>
</body>
</html>
